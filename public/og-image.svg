<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="50%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative clouds -->
  <g fill="white" opacity="0.6">
    <ellipse cx="180" cy="120" rx="100" ry="35"/>
    <ellipse cx="220" cy="100" rx="60" ry="40"/>
    <ellipse cx="160" cy="100" rx="55" ry="38"/>

    <ellipse cx="1000" cy="500" rx="120" ry="40"/>
    <ellipse cx="1050" cy="475" rx="70" ry="45"/>
    <ellipse cx="970" cy="475" rx="65" ry="42"/>
  </g>

  <!-- Center cloud logo (outline) -->
  <g transform="translate(440, 130)">
    <path
      d="M50 130
         a26 26 0 0 1 -2 -52
         a18 18 0 0 1 6 -14
         a30 30 0 0 1 54 4
         a22 22 0 0 1 36 18
         a22 22 0 0 1 6 44
         z"
      stroke="url(#cloud)"
      stroke-width="9"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
      transform="scale(2.2)"/>
  </g>

  <!-- Wordmark -->
  <text
    x="600"
    y="500"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', system-ui, sans-serif"
    font-size="96"
    font-weight="700"
    letter-spacing="-2"
    fill="url(#brandGrad)"
  >Kumo</text>

  <!-- Tagline -->
  <text
    x="600"
    y="555"
    text-anchor="middle"
    font-family="system-ui, sans-serif"
    font-size="28"
    font-weight="400"
    fill="#64748b"
  >Tus gastos, como una nube perfecta</text>
</svg>
